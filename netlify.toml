[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Decap CMS: /admin ve /admin/ -> admin UI
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 302
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Kfz kategorisi kaldırıldı – eski URL'ler ana Leistungen sayfasına yönlendirilir
[[redirects]]
  from = "/leistungen/kfz"
  to = "/leistungen/"
  status = 301
[[redirects]]
  from = "/leistungen/kfz/*"
  to = "/leistungen/"
  status = 301
